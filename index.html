<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashwera Hasan</title>
    <meta name="description" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="is-loading">
    <div
      class="preloader"
      id="preloader"
      role="progressbar"
      aria-label="Loading site"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="preloader-inner">
        <div class="preloader-line" aria-hidden="true">
          <span></span>
        </div>
      </div>
    </div>

    <div class="bg-texture" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbar-left">
        <span>Mumbai, India</span>
        <span id="live-time">00:00 AM GMT+5:30</span>
        <span>19.0760° N, 72.8777° E</span>
      </div>

      <nav class="topbar-nav" aria-label="Primary navigation">
        <a href="/">HOME</a>
        <a href="/#projects">WORKS</a>
        <a href="#">BREAK</a>
        <a href="/resume" target="_blank" rel="noreferrer">RESUME</a>
        <a href="/about">ABOUT</a>
      </nav>
    </header>

    <main class="home" id="home">
      <section class="hero" aria-labelledby="hero-name">
        <h1 id="hero-name" class="hero-name" aria-label="Ashwera Hasan">
          <span class="name-row">Ashwera</span>
          <span class="name-row">Hasan</span>
        </h1>

        <div class="hero-lower">
          <p class="role role-left">Fullstack Developer</p>
          <p class="role role-right">Content Engineer</p>
        </div>

        <p class="hero-summary">
          I enjoy solving challenging problems through competitive programming
          and exploring how they translate into real-world intelligent systems.
        </p>
      </section>

      <section id="projects" class="projects-panel" aria-label="Selected works">
        <div id="works-root"></div>
      </section>

      <section
        id="github-activity"
        class="github-panel"
        aria-label="GitHub activity"
      >
        <div id="github-graph-root"></div>
      </section>

      <section
        id="experience"
        class="experience-panel"
        aria-label="Professional experience"
      >
      <!-- later when i have more to show: i want the experience scroll entirely redone
i want the heading to come in the center. and then an automatically moving slideshow of my experience from left to right.  -->
        <div id="experience-root"></div>
      </section>

      <section
        id="achievements"
        class="achievements-panel"
        aria-label="Achievements and recognition"
      >
        <div id="achievements-root"></div>
      </section>
    </main>

    <div class="name-glow" id="name-glow" aria-hidden="true"></div>
    <div class="name-cursor" id="name-cursor" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
